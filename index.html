<!DOCTYPE html>
<html lang="en">
<head>

<title>Offline List Builder – Warhammer 40,000</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="topbar">
  <div class="brand" data-act="home" title="Home">⚔ <span>Offline List Builder</span></div>

  <a class="btn sm" id="help-btn" href="help.html" target="_blank" title="Help – open the user guide">?</a>

<main id="main"><div class="loading">Loading…</div></main>
